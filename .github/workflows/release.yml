name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Test and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --legacy-peer-deps --registry=https://registry.npmjs.org --ignore-scripts --no-audit --no-fund || npm install --legacy-peer-deps --package-lock=false --registry=https://registry.npmjs.org --ignore-scripts --no-audit --no-fund
          # Install the optional native Canvas binary before staging test-only
          # Harness peers. A root npm install run afterwards prunes the staged
          # peer packages because they are intentionally not package deps.
          npm install --no-save --legacy-peer-deps --registry=https://registry.npmjs.org @napi-rs/canvas-linux-x64-gnu@1.0.6
          # --legacy-peer-deps above deliberately skips peer dependencies. The
          # stream-contract test imports the plugin entry, so stage just its
          # published Harness runtime graph in an isolated manifest, then merge it.
          mkdir -p .ci-runtime
          cat > .ci-runtime/package.json <<'JSON'
          {
            "private": true,
            "dependencies": {
              "@deepseek-ai/cordis": "^4.0.1-rc.1",
              "@deepseek-ai/dsh-brand": "^0.0.1-rc.1",
              "@deepseek-ai/dsh-code-runtime": "^0.0.1-rc.1",
              "@deepseek-ai/dsh-invariants": "^0.0.1-rc.1",
              "@deepseek-ai/dsh-llm": "^0.0.1-rc.1",
              "@deepseek-ai/dsh-scope": "^0.0.1-rc.1",
              "@deepseek-ai/dsh-session": "^0.0.1-rc.1",
              "@deepseek-ai/dsh-settings": "^0.0.1-rc.1",
              "@deepseek-ai/dsh-timeout": "^0.0.1-rc.1",
              "@deepseek-ai/dsh-tools": "^0.0.1-rc.1",
              "@deepseek-ai/schemastery": "^3.18.1-rc.1",
              "react": "^18.2.0"
            }
          }
          JSON
          npm install --prefix .ci-runtime --legacy-peer-deps --package-lock=false --registry=https://registry.npmjs.org --no-audit --no-fund
          cp -a .ci-runtime/node_modules/. node_modules/

      - name: Validate tag version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          tag_version="${RELEASE_TAG#v}"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag $RELEASE_TAG does not match package.json version $package_version" >&2
            exit 1
          fi

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          if ! npm test 2>&1 | tee test-output.log; then
            while IFS= read -r line; do
              [[ -n "$line" ]] && echo "::error::$line"
            done < <(tail -n 80 test-output.log)
            exit 1
          fi

      - name: Generate release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          previous_tag="$(git tag --merged "$RELEASE_TAG" --sort=-version:refname | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$' | grep -vxF "$RELEASE_TAG" | head -n 1 || true)"
          if [[ -n "$previous_tag" ]]; then
            node scripts/release-notes.mjs --from "$previous_tag" --to "$RELEASE_TAG" --version "${RELEASE_TAG#v}" --output release-notes.md
          else
            node scripts/release-notes.mjs --to "$RELEASE_TAG" --version "${RELEASE_TAG#v}" --output release-notes.md
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # A retagged release keeps the notes explicitly generated for that release.
            gh release edit "$RELEASE_TAG" --title "dsh-sfversion ${RELEASE_TAG}"
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "dsh-sfversion ${RELEASE_TAG}" --notes-file release-notes.md
          fi
