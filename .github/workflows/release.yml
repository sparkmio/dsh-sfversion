name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Test and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --legacy-peer-deps --registry=https://registry.npmjs.org --ignore-scripts --no-audit --no-fund || npm install --legacy-peer-deps --package-lock=false --registry=https://registry.npmjs.org --ignore-scripts --no-audit --no-fund
          npm install --no-save --legacy-peer-deps --registry=https://registry.npmjs.org @napi-rs/canvas-linux-x64-gnu@1.0.6

      - name: Validate tag version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          tag_version="${RELEASE_TAG#v}"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag $RELEASE_TAG does not match package.json version $package_version" >&2
            exit 1
          fi

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          if ! npm test 2>&1 | tee test-output.log; then
            while IFS= read -r line; do
              [[ -n "$line" ]] && echo "::error::$line"
            done < <(tail -n 80 test-output.log)
            exit 1
          fi

      - name: Generate release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          previous_tag="$(git tag --merged "$RELEASE_TAG" --sort=-version:refname | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$' | grep -vxF "$RELEASE_TAG" | head -n 1 || true)"
          if [[ -n "$previous_tag" ]]; then
            node scripts/release-notes.mjs --from "$previous_tag" --to "$RELEASE_TAG" --version "${RELEASE_TAG#v}" --output release-notes.md
          else
            node scripts/release-notes.mjs --to "$RELEASE_TAG" --version "${RELEASE_TAG#v}" --output release-notes.md
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --title "dsh-sfversion ${RELEASE_TAG}" --notes-file release-notes.md
