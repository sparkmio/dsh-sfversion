name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Test and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate tag version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          tag_version="${RELEASE_TAG#v}"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag $RELEASE_TAG does not match package.json version $package_version" >&2
            exit 1
          fi

      - name: Run tests
        run: npm test

      - name: Generate release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          previous_tag="$(git tag --merged "$RELEASE_TAG" --sort=-version:refname | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$' | grep -vxF "$RELEASE_TAG" | head -n 1 || true)"
          if [[ -n "$previous_tag" ]]; then
            node scripts/release-notes.mjs --from "$previous_tag" --to "$RELEASE_TAG" --version "${RELEASE_TAG#v}" --output release-notes.md
          else
            node scripts/release-notes.mjs --to "$RELEASE_TAG" --version "${RELEASE_TAG#v}" --output release-notes.md
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --title "dsh-sfversion ${RELEASE_TAG}" --notes-file release-notes.md
